description: |
  Pimoroni PIM447 Trackball Breakout - I2C RGBW-illuminated clickable trackball.

  The driver supports two modes of operation:

    INTERRUPT-DRIVEN (preferred): if int-gpios is defined, the driver uses
    the PIM447's INT line to wake on motion or button activity. CPU is only
    used when there is actual input. Much better for battery life and BLE
    responsiveness on busy systems.

    POLLING (fallback): if int-gpios is not defined, the driver polls at
    poll-interval-ms. Easier to wire (no INT line needed) but uses more CPU.

compatible: "pimoroni,pim447"

include: [i2c-device.yaml]

properties:
  int-gpios:
    type: phandle-array
    description: |
      GPIO connected to the PIM447's INT pad. Open-drain active-low; the
      driver enables an internal pull-up. If this property is set, the
      driver runs in interrupt-driven mode and poll-interval-ms is ignored.

  poll-interval-ms:
    type: int
    default: 15
    description: |
      Polling interval in milliseconds. Used only if int-gpios is not set.

  swap-xy:
    type: boolean
    description: Swap X and Y axes.

  invert-x:
    type: boolean
    description: Invert the X axis.

  invert-y:
    type: boolean
    description: Invert the Y axis.

  base-scale:
    type: int
    default: 16
    description: |
      Linear baseline multiplier, in 1/16ths. base-scale=16 is 1.0x.
      Applies to all reported movement before any acceleration kicks in.

  accel-divisor:
    type: int
    default: 0
    description: |
      Magnitude threshold (in raw counts) above which acceleration kicks in.
      Set to 0 to disable acceleration entirely.

  accel-exponent:
    type: int
    default: 0
    description: |
      Curve aggressiveness. 0 disables. 1 linear additive, 2 quadratic, 3 cubic.

  jitter-threshold:
    type: int
    default: 1
    description: |
      Raw per-axis count (before acceleration) at or below which a read is
      treated as sensor noise and dropped instead of reported. Trackball
      encoders commonly produce single-count blips at rest (dust, vibration,
      thermal settling); reporting these as real input keeps resetting ZMK's
      idle-sleep timer, preventing deep sleep and draining the battery even
      though nothing is actually being touched. Set to 0 to disable.
